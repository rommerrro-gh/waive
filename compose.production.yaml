services:
  api:
    ports: !reset []
    restart: unless-stopped
  db:
    restart: unless-stopped
  inference:
    restart: unless-stopped
  proxy:
    image: caddy:2.10-alpine
    environment:
      WAIVE_HOST: ${WAIVE_HOST:?Укажите DNS-имя стенда}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
