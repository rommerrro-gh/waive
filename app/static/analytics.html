<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waive | Аналитика поиска</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/analytics.js" defer></script>
</head>
<body>
  <main>
    <nav><a href="/">Вернуться к поиску</a></nav>
    <h1>Аналитика поиска</h1>
    <form id="analytics-form">
      <label for="analytics-token">Ключ аналитики</label>
      <div class="field">
        <input id="analytics-token" type="password" required autocomplete="off">
        <button type="submit">Обновить</button>
      </div>
      <label class="demo-mode">Профиль закупки
        <select id="analytics-profile">
          <option value="">Все запросы</option>
          <option value="true">С профилем</option>
          <option value="false">Без профиля</option>
        </select>
      </label>
      <label class="demo-mode"><input id="analytics-demo" type="checkbox"> Только демо-запросы</label>
    </form>
    <p id="analytics-status" role="status"></p>
    <section id="analytics-report" hidden>
      <dl id="metrics" class="metrics"></dl>
      <h2>Запросы для проверки</h2>
      <p id="analytics-empty" hidden>За выбранный период нет запросов для проверки.</p>
      <div class="analytics-table">
        <table>
          <thead><tr><th scope="col">Запрос и условия</th><th scope="col">Поиски</th>
            <th scope="col">Причина</th><th scope="col">Что проверить</th></tr></thead>
          <tbody id="misses"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
