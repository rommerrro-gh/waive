<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waive | Поиск по каталогу</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/search.js" defer></script>
</head>
<body>
  <main>
    <h1>Поиск по каталогу Softline</h1>
    <form role="search">
      <label for="query">Название, бренд или артикул</label>
      <div class="field">
        <input id="query" name="q" type="search" required maxlength="200" placeholder="КриптоПро CSP 5.0">
        <button type="submit">Найти</button>
      </div>
      <label><input id="lexical" type="checkbox"> Только текстовый поиск</label>
    </form>
    <p id="status" role="status"></p>
    <section id="results" class="cards" aria-label="Результаты поиска"></section>
    <section id="alternatives" hidden><h2>Альтернативы</h2><div class="cards"></div></section>
    <section id="recommendations" hidden><h2>Сопутствующие товары</h2><div class="cards"></div></section>
  </main>
</body>
</html>
