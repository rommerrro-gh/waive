<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waive | Поиск по каталогу</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/search.js" defer></script>
  <script src="/procurement.js" defer></script>
</head>
<body>
  <main>
    <nav><a href="/analytics.html">Аналитика поиска</a></nav>
    <h1>Поиск по каталогу Softline</h1>
    <form id="search" role="search">
      <label for="query">Название, бренд или артикул</label>
      <div class="field">
        <div class="query-field">
          <input id="query" name="q" type="search" required maxlength="200"
                 placeholder="КриптоПро CSP 5.0" autocomplete="off" role="combobox"
                 aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
          <ul id="suggestions" role="listbox" aria-label="Подсказки поиска" hidden></ul>
        </div>
        <button type="submit">Найти</button>
      </div>
      <label><input id="lexical" type="checkbox"> Только текстовый поиск</label>
      <fieldset class="purchase-filters">
        <legend>Условия закупки</legend>
        <label>Платформа
          <select name="platform">
            <option value="">Любая</option>
            <option value="windows">Windows</option>
            <option value="windows-server">Windows Server</option>
            <option value="linux">Linux</option>
            <option value="astra-linux">Astra Linux</option>
            <option value="macos">macOS</option>
          </select>
        </label>
        <label>Срок лицензии
          <select name="term">
            <option value="">Любой</option>
            <option value="1">1 месяц</option>
            <option value="3">3 месяца</option>
            <option value="6">6 месяцев</option>
            <option value="12">12 месяцев</option>
            <option value="24">24 месяца</option>
            <option value="36">36 месяцев</option>
            <option value="perpetual">Бессрочная</option>
          </select>
        </label>
        <label>Тип лицензии
          <select name="license_type">
            <option value="">Любой</option>
            <option value="new">Новая лицензия</option>
            <option value="subscription">Подписка</option>
            <option value="renewal">Продление</option>
            <option value="upgrade">Обновление</option>
          </select>
        </label>
        <label>Рабочих мест
          <input id="workplaces" type="number" min="1" max="1000000" step="1" placeholder="Например, 50">
        </label>
        <div class="profile-actions card-actions">
          <button id="save-profile" class="secondary" type="button">Сохранить профиль закупки</button>
          <button id="restore-profile" class="secondary" type="button" hidden>Подставить профиль</button>
          <button id="delete-profile" class="secondary" type="button" hidden>Удалить профиль</button>
          <span id="profile-status" role="status"></span>
        </div>
      </fieldset>
      <label class="demo-mode"><input name="demo" type="checkbox" value="true"> Записывать как демо</label>
      <div id="filter-suggestions" class="card-actions" aria-label="Предложенные фильтры" hidden></div>
    </form>
    <section id="comparison-bar" class="comparison-bar" aria-label="Выбранные предложения" hidden>
      <p id="comparison-count" role="status"></p>
      <div id="comparison-items"></div>
      <button id="open-comparison" type="button" disabled>Сравнить предложения</button>
    </section>
    <details id="approval" class="approval">
      <summary id="approval-count">Список на согласование · 0</summary>
      <p id="approval-empty">Добавьте предложения из поиска или комплекта.</p>
      <ul id="approval-items"></ul>
      <div class="card-actions">
        <button id="export-approval" type="button" class="secondary" disabled>Скачать CSV</button>
        <button id="quote-preview" type="button" disabled>Черновик запроса КП</button>
      </div>
      <section id="quote" hidden>
        <label for="quote-text">Текст запроса коммерческого предложения</label>
        <textarea id="quote-text" rows="12"></textarea>
        <button id="quote-download" type="button" class="secondary">Скачать черновик TXT</button>
      </section>
    </details>
    <p id="status" role="status"></p>
    <div id="filter-details" class="card-actions" hidden></div>
    <section id="results" class="cards" aria-label="Результаты поиска"></section>
    <section id="alternatives" hidden><h2>Альтернативы</h2><div class="cards"></div></section>
    <section id="bundle" class="approval" hidden aria-labelledby="bundle-title">
      <h2 id="bundle-title">Комплект для компании</h2>
      <p id="bundle-message" role="status"></p>
      <div class="cards"></div>
    </section>
    <section id="recommendations" hidden><h2>Допродажи с проверкой характеристик</h2><div class="cards"></div></section>
  </main>
  <dialog id="comparison" aria-labelledby="comparison-title">
    <div class="dialog-header">
      <h2 id="comparison-title">Сравнение предложений</h2>
      <form method="dialog"><button type="submit">Закрыть</button></form>
    </div>
    <div id="comparison-content" class="comparison-content"></div>
  </dialog>
</body>
</html>
