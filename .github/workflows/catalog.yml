name: Замер выдачи магазина Softline
on:
  push:
    branches: [probe/softline-search]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Собрать первые четыре публичные карточки по 33 запросам
        run: python3 scripts/compare_public_store.py --feed organizer-materials/Mindbox.xml.gz
      - name: Сохранить замер публичной выдачи
        uses: actions/upload-artifact@v4
        with:
          name: softline-live-results
          path: softline-live-results.json
