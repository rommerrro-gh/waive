name: Проверка доступа к поиску Softline
on:
  push:
    branches: [probe/softline-search]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Выполнить один публичный поисковый запрос
        run: |
          python3 - <<'PY'
          import re
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from html import unescape

          url = "https://store.softline.ru/search/?query=AnyDesk"
          try:
              with urlopen(Request(url, headers={"User-Agent": "Waive catalog comparison (single public request)"}), timeout=15) as response:
                  html = response.read(2000000).decode("utf-8", "replace")
                  print("HTTP:", response.status, "URL:", response.url, "HTML bytes:", len(html))
          except (HTTPError, URLError, TimeoutError) as error:
              print("Доступность:", getattr(error, "code", None), str(error))
          else:
              titles = re.findall(r"<(?:title|h1)[^>]*>(.*?)</(?:title|h1)>", html, re.I | re.S)
              print("Заголовок:", [unescape(re.sub("<[^>]+>", "", item)).strip()[:220] for item in titles[:5]])
              for line in re.findall(r'<[^<>]{0,300}AnyDesk[^<>]{0,350}>', html, re.I)[:18]:
                  if "href=" in line or "class=" in line:
                      print(line[:500])
          PY
